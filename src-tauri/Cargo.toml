[package]
name = "agentql"
version = "0.1.0"
description = "AgentQL - an agentic, cross-platform database client"
authors = ["aindong"]
edition = "2024"
license = "MIT"
repository = "https://github.com/OpenSkye-Labs/agentQL"

[lib]
name = "agentql_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
futures = "0.3"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "mysql",
  "sqlite",
  "chrono",
  "uuid",
  "json",
  "rust_decimal",
  "bigdecimal",
  "time",
  "ipnetwork",
  "mac_address",
  "bit-vec",
] }
redis = { version = "0.27", features = ["tokio-comp", "tokio-rustls-comp"] }
mongodb = "3"
bson = { version = "2", features = ["serde_with-3", "chrono-0_4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
keyring = { version = "3", features = [
  "apple-native",
  "windows-native",
  "async-secret-service",
  "crypto-rust",
  "tokio",
] }
sqlparser = { version = "0.53", features = ["visitor"] }
async-stream = "0.3"
bytes = "1"
csv = "1"
rand = "0.8"
url = "2"
log = "0.4"
russh = "0.64"
axum = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
