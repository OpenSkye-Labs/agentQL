name: Perf

# Measures the release build on Linux, macOS and Windows for docs/PERFORMANCE.md (scripts/perf/bench-app.mjs).
# Hosted runners are shared VMs (Linux renders through Xvfb in software), so compare runs with each other, not with
# numbers from a desktop.
# Releases dispatch it from release-please.yml (workflow-token releases trigger nothing on their own).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/perf/bench-app.mjs
      - src/lib/bench.ts
      - src-tauri/src/bench.rs
      - .github/workflows/perf.yml

permissions:
  contents: read

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the job runs the PR's code

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config xvfb

      - run: pnpm install --frozen-lockfile

      - run: pnpm tauri build --no-bundle

      - name: Bench
        shell: bash
        run: |
          bin=src-tauri/target/release/agentql
          if [ "$RUNNER_OS" = Windows ]; then bin=$bin.exe; fi
          if [ "$RUNNER_OS" = Linux ]; then run="xvfb-run -a"; fi
          $run node scripts/perf/bench-app.mjs "$bin" 5 | tee perf.json # xvfb-run folds stderr in; keep it in the log
          { echo '### ${{ matrix.os }}'; echo '```json'; cat perf.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
